name: nx-libs CI diff archs

on:
  push:
    branches: [ citest2 ]
  pull_request:
    branches: [ 3.6.x ]

jobs:
  build:
    runs-on: ubuntu-20.04
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }} with ${{ matrix.cc }} and ${{ matrix.cxx }}

    # Run steps on a matrix of 16 arch/distro/cc combinations
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            distro: ubuntu20.04
            cc: gcc
            cxx: g++
          - arch: aarch64
            distro: ubuntu20.04
            cc: clang
            cxx: clang++
          - arch: ppc64le
            distro: ubuntu20.04
            cc: gcc
            cxx: g++
          - arch: ppc64le
            distro: ubuntu20.04
            cc: clang
            cxx: clang++
          - arch: s390x
            distro: ubuntu20.04
            cc: gcc
            cxx: g++
          - arch: s390x
            distro: ubuntu20.04
            cc: clang
            cxx: clang++
          - arch: armv7
            distro: ubuntu20.04
            cc: gcc
            cxx: g++
          - arch: armv7
            distro: ubuntu20.04
            cc: clang
            cxx: clang++
          - arch: aarch64
            distro: ubuntu22.04
            cc: gcc
            cxx: g++
          - arch: aarch64
            distro: ubuntu22.04
            cc: clang
            cxx: clang++
          - arch: ppc64le
            distro: ubuntu22.04
            cc: gcc
            cxx: g++
          - arch: ppc64le
            distro: ubuntu22.04
            cc: clang
            cxx: clang++
          - arch: s390x
            distro: ubuntu22.04
            cc: gcc
            cxx: g++
          - arch: s390x
            distro: ubuntu22.04
            cc: clang
            cxx: clang++
          - arch: armv7
            distro: ubuntu22.04
            cc: gcc
            cxx: g++
          - arch: armv7
            distro: ubuntu22.04
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - uses: uraimo/run-on-arch-action@v2.0.8
        name: Build artifact
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          cc: ${{ matrix.cc }}

          # Not required, but speeds up builds
          githubToken: ${{ github.token }}

          # Pass some environment variables to the container
          env: |
            CC: ${{ matrix.cc }}
            CXX: ${{ matrix.cxx }}
            DEBIAN_FRONTEND: noninteractive

          # The shell to run commands with in the container
          shell: /bin/sh

          # Install some dependencies in the container. This speeds up builds if
          # you are also using githubToken. Any dependencies installed here will
          # be part of the container image that gets cached, so subsequent
          # builds don't have to re-install them. The image layer is cached
          # publicly in your project's package repository, so it is vital that
          # no secrets are present in the container state or logs.
          install: |
            case "${{ matrix.distro }}" in
              ubuntu*)
                cat /etc/debian_version
                apt-get update -q -y
                apt-get install -q -y ${{ matrix.cc }} ${{ matrix.cxx }}
                case "${{ matrix.cc }}" in
                  gcc)
                    apt-get install -q -y g++
                    ;;
                  clang)
                    apt-get install -q -y build-essential
                    ;;
                esac
                ${{ matrix.cc }} --version
                # basic packages
                apt-get install -q -y \
                  autoconf libtool make pkg-config
                # imake deps
                apt-get install -q -y \
                  libxkbfile-dev xfonts-utils xutils-dev
                # X11 libraries deps
                apt-get install -q -y \
                  libpixman-1-dev libjpeg-dev libxcomposite-dev libxdamage-dev \
                  libxml2-dev libxfont-dev libxinerama-dev libxpm-dev libxrandr-dev \
                  libxtst-dev x11proto-fonts-dev
                # soft requirements
                apt-get install -q -y \
                  quilt x11-xkb-utils
                ;;
            esac

          run: |
            make

